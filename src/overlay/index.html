<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    cursor: crosshair;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  #dim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
  }
  #selection {
    position: fixed;
    border: 1.5px solid #ff3b6b;
    background: rgba(255, 59, 107, 0.08);
    box-shadow: 0 0 0 4000px rgba(0,0,0,0.35);
    display: none;
  }
  #hint {
    position: fixed;
    top: 24px; left: 50%;
    transform: translateX(-50%);
    background: rgba(28,28,30,0.85);
    color: #fff;
    font: 13px -apple-system, system-ui, sans-serif;
    padding: 8px 14px;
    border-radius: 8px;
    letter-spacing: 0.2px;
  }
  #dims {
    position: fixed;
    background: #ff3b6b;
    color: #fff;
    font: 12px -apple-system, system-ui, sans-serif;
    padding: 2px 6px;
    border-radius: 5px;
    display: none;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="dim"></div>
  <div id="hint">Drag to select an area &nbsp;·&nbsp; Esc to cancel</div>
  <div id="selection"></div>
  <div id="dims"></div>
  <script src="overlay.js"></script>
</body>
</html>
